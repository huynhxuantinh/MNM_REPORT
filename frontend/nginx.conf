map $request_uri $spa_html_cache_control {
    default "no-store, no-cache, must-revalidate, private";
    ~^/about/?(\?.*)?$ "public, max-age=300, must-revalidate";
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/conf.d/security_headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control $spa_html_cache_control always;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        expires 7d;
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
