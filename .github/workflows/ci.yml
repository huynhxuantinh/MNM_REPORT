name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ───────────────────────────────────────────────────────────────
  # Backend Tests
  # ───────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mnm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run migrations
        working-directory: ./backend
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci"
          DB_NAME: test_mnm
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci"
          DB_NAME: test_mnm
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest --cov=apps --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ───────────────────────────────────────────────────────────────
  # Frontend Tests
  # ───────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage

  # ───────────────────────────────────────────────────────────────
  # Frontend Cypress Smoke (mocked API)
  # ───────────────────────────────────────────────────────────────
  frontend-cypress-smoke:
    name: Frontend Cypress Smoke
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: List Cypress smoke specs
        run: find frontend/cypress/e2e/mocked -type f -name "*.cy.js" -print

      - name: Run student Cypress smoke
        working-directory: ./frontend
        run: npm run cy:run -- --spec cypress/e2e/mocked/learning_flow.cy.js
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

      - name: Run admin Cypress smoke
        working-directory: ./frontend
        run: npm run cy:run -- --spec cypress/e2e/mocked/admin_flow.cy.js
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-smoke
          path: frontend/cypress/videos

  # Integration Smoke (real backend + DB)
  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Create CI environment file
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=config.settings.development
          SECRET_KEY=test-secret-key-for-ci
          DEBUG=True
          ALLOWED_HOSTS=127.0.0.1,localhost,backend
          FRONTEND_URL=http://localhost:5173
          DB_NAME=norostu
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=postgres
          DB_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=redispass
          REDIS_DB=0
          REDIS_URL=redis://:redispass@redis:6379/0
          CELERY_BROKER_URL=redis://:redispass@redis:6379/1
          CELERY_RESULT_BACKEND=redis://:redispass@redis:6379/2
          JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
          JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
          JWT_SIGNING_KEY=test-jwt-signing-key
          CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DEFAULT_FROM_EMAIL=NoroStu <noreply@norostu.com>
          MEDIA_URL=/media/
          STATIC_URL=/static/
          USE_S3=False
          VITE_API_BASE_URL=http://127.0.0.1:8000/api/v1
          VITE_APP_NAME=NoroStu
          VITE_APP_VERSION=1.0.0
          VITE_SITE_URL=https://norostu.com
          BACKEND_PORT=8000
          FRONTEND_PORT=5173
          LOG_LEVEL=DEBUG
          LOG_DIR=logs/
          DEFAULT_PAGE_SIZE=20
          MAX_PAGE_SIZE=100
          EOF

      - name: Reset integration stack
        run: docker compose -f docker-compose.yml down -v --remove-orphans

      - name: Start integration data services
        run: |
          docker compose -f docker-compose.yml up -d --build postgres redis

      - name: Run integration migrations
        run: |
          docker compose -f docker-compose.yml run --rm --no-deps backend python manage.py migrate --noinput

      - name: Seed integration smoke dataset
        run: |
          docker compose -f docker-compose.yml run --rm --no-deps backend python manage.py seed_full_catalog --clear
          docker compose -f docker-compose.yml run --rm --no-deps backend python manage.py seed_learning_path
          docker compose -f docker-compose.yml run --rm --no-deps backend python manage.py seed_listening_demo --clear

      - name: Start integration app services
        run: |
          docker compose -f docker-compose.yml up -d backend celery-worker celery-beat

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if nc -z 127.0.0.1 8000; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=200
          exit 1

      - name: List Cypress integration specs
        run: find frontend/cypress/e2e/integration -type f -name "*.cy.js" -print

      - name: Run integration Cypress smoke
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          install: false
          command: npm run cy:run -- --spec "cypress/e2e/integration/auth_learning_smoke.cy.js"
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

      - name: Upload integration screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-integration
          path: frontend/cypress/screenshots

      - name: Upload integration videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-integration
          path: frontend/cypress/videos

      - name: Stop integration stack
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ───────────────────────────────────────────────────────────────
  # Security Scan
  # ───────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
          pip install bandit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Bandit (Python security linter)
        run: bandit -r backend/apps -f json -o bandit-report.json || true

      - name: Run npm audit (warning only for moderate issues)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            bandit-report.json

  # ───────────────────────────────────────────────────────────────
  # Deploy to Staging (main branch only)
  # ───────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-cypress-smoke, integration-smoke, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          echo "Deploy to staging server here"
          # Add your deployment script here
          # Example: SSH to server and pull latest code

  # ───────────────────────────────────────────────────────────────
  # Deploy to Production (tags only)
  # ───────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, frontend-cypress-smoke, integration-smoke, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production
      url: https://norostu.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploy to production server here"
          # Add your production deployment script here
