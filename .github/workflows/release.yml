name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────────
  # Backend Tests (bắt buộc pass trước khi release)
  # ───────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mnm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run tests
        working-directory: ./backend
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci"
          DB_NAME: test_mnm
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate
          pytest --tb=short -q

  # ───────────────────────────────────────────────────────────────
  # Frontend Tests
  # ───────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1

  # ───────────────────────────────────────────────────────────────
  # Tạo GitHub Release
  # ───────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Lấy toàn bộ history để generate changelog

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Lấy tag trước đó
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            # Lần release đầu tiên → lấy toàn bộ commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi

          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

          # Ghi changelog vào file
          cat > CHANGELOG_RELEASE.md << EOF
          ## NoroStu ${{ steps.version.outputs.VERSION }}

          ### 📋 Thay đổi kể từ ${PREV_TAG:-"lần đầu"}

          ${COMMITS}

          ---

          ### 🚀 Hướng dẫn chạy nhanh
          \`\`\`bash
          docker compose up -d
          docker compose exec backend python manage.py migrate
          docker compose exec backend python manage.py seed_data
          \`\`\`

          ### 🔗 URL
          - Frontend: http://localhost:5173
          - Backend API: http://localhost:8000/api/v1/
          - Swagger: http://localhost:8000/api/docs/

          ### 👤 Tài khoản mẫu
          - Admin: \`admin@norostu.com\` / \`Admin@2024!\`
          - Student: \`student@norostu.com\` / \`Student@2024!\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "NoroStu ${{ steps.version.outputs.VERSION }}"
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
