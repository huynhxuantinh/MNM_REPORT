services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-norostu}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-norostu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnm_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ../../.env
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-redis-password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnm_network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: production.txt
    image: mnm_report-backend-prod
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_NAME: ${DB_NAME:-norostu}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis-password}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
    volumes:
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - mnm_network

  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: production.txt
    image: mnm_report-backend-prod
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_NAME: ${DB_NAME:-norostu}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis-password}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery worker -l info -c 2
    networks:
      - mnm_network

  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: production.txt
    image: mnm_report-backend-prod
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_NAME: ${DB_NAME:-norostu}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis-password}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - mnm_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
    image: mnm_report-frontend-prod
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "${FRONTEND_PROD_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mnm_network

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  mnm_network:
    driver: bridge
