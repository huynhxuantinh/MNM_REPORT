
services:
  # ───────────────────────────── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: mnm_postgres
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnm_network

  # ───────────────────────────── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mnm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnm_network

  # ───────────────────────────── Backend (Django) ───────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mnm_report-backend-dev
    container_name: mnm_backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - ../../backend:/app
      - static_files:/app/static
      - media_files:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - mnm_network

  # ───────────────────────────── Celery Worker ─────────────────────────
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mnm_report-backend-dev
    container_name: mnm_celery_worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery worker -l info -c 2
    networks:
      - mnm_network

  # ───────────────────────────── Celery Beat ────────────────────────────
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mnm_report-backend-dev
    container_name: mnm_celery_beat
    restart: unless-stopped
    env_file: ../../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - ../../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - mnm_network

  # ───────────────────────────── Frontend (React + Vite) ────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: mnm_report-frontend-dev
    container_name: mnm_frontend
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - mnm_network

# ─────────────────────────────── Volumes ──────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

# ─────────────────────────────── Networks ─────────────────────────────────
networks:
  mnm_network:
    driver: bridge
